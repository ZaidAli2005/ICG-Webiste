# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: dashboard.render.com -> New -> Blueprint -> pick this repo.
# Render reads this file automatically; no manual settings needed.

services:
  - type: web
    runtime: static
    name: gicg-website
    branch: main

    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    # Auto-deploy on every push to main.
    autoDeployTrigger: commit

    # This is a client-side-routed SPA. Without this rule, refreshing
    # /about or /faculty returns 404 instead of loading index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Vite emits content-hashed filenames, so these can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html must never be cached, or clients pin to a stale build.
      - path: /*
        name: Cache-Control
        value: no-cache